<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 3 - Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cat-theme">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Assignment #4</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Part 1 (HTML5)</a></li>
                    <li class="nav-item"><a class="nav-link" href="bootstrap.html">Part 2 (Bootstrap)</a></li>
                    <li class="nav-item"><a class="nav-link active" href="register.html">Part 3 (Register)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5 d-flex justify-content-center">
        <div class="cat-card row g-0 shadow-lg">
            <div class="col-md-5 cat-left d-flex flex-column align-items-center justify-content-center p-4">
                <div class="cat-icon">🐾</div>
                <h2 class="cat-title fw-bold">CAT CUTE</h2>
                <p class="text-center text-white-50">Join our community today!</p>
            </div>
            <div class="col-md-7 cat-right p-4 p-md-5 bg-white">
                <h3 class="mb-4 text-center text-danger">CREATE ACCOUNT</h3>
                
                <form class="needs-validation" novalidate>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" required>
                            <div class="invalid-feedback">First name required.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" required>
                            <div class="invalid-feedback">Last name required.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="regEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="regEmail" required>
                        <div class="invalid-feedback">Valid email required.</div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" minlength="8" required>
                            <div class="invalid-feedback">Min 8 characters required.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
                            <div class="invalid-feedback">Password must match.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                            <label class="form-check-label" for="male">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                            <label class="form-check-label" for="female">Female</label>
                        </div>
                    </div>

                    <!-- Hobbies Checkboxes -->
                    <div class="mb-3">
                        <label class="form-label d-block">Hobbies</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="coding">
                            <label class="form-check-label" for="coding">Coding</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="gaming">
                            <label class="form-check-label" for="gaming">Gaming</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="reading">
                            <label class="form-check-label" for="reading">Reading</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="country" class="form-label">Country</label>
                        <select class="form-select" id="country" required>
                            <option value="" selected disabled>Choose country...</option>
                            <option value="kz">Kazakhstan</option>
                            <option value="us">USA</option>
                            <option value="uk">UK</option>
                        </select>
                        <div class="invalid-feedback">Please select a country.</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger flex-grow-1">REGISTER</button>
                        <button type="reset" class="btn btn-outline-secondary">RESET</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

  <script>
    (() => {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          const pass = document.getElementById('password');
          const confirmPass = document.getElementById('confirmPassword');

          if (pass.value !== confirmPass.value) {
            confirmPass.setCustomValidity("Passwords don't match");
          } else {
            confirmPass.setCustomValidity("");
          }

          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
</body>
</html>
