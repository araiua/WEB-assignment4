<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="kawaii-theme">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
        <a class="navbar-brand" href="#">Assignment #4</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Part 1 (HTML5)</a></li>
                <li class="nav-item"><a class="nav-link active" href="bootstrap.html">Part 2 (Bootstrap)</a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Part 3 (Register)</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="kawaii-card p-4">
                    <div class="kawaii-header mb-3 text-center">
                        <span>SPECIAL STREAM FORM</span>
                    </div>
                    <form class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="bs-name" class="form-label fw-bold">Name</label>
                            <input type="text" class="form-control kawaii-input" id="bs-name" placeholder="Enter name" required>
                            <div class="valid-feedback">Looks good!</div>
                            <div class="invalid-feedback">Please enter your name.</div>
                        </div>

                        <div class="mb-3">
                            <label for="bs-email" class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control kawaii-input" id="bs-email" placeholder="name@domain.com" required>
                            <div class="form-text">We'll never share your email with anyone else.</div>
                            <div class="valid-feedback">Looks good!</div>
                            <div class="invalid-feedback">Email is required and must be valid.</div>
                        </div>

                        <div class="mb-3">
                            <label for="bs-message" class="form-label fw-bold">Message</label>
                            <textarea class="form-control kawaii-input" id="bs-message" rows="3" required></textarea>
                            <div class="valid-feedback">Looks good!</div>
                            <div class="invalid-feedback">Message cannot be empty.</div>
                        </div>

                        <button class="btn kawaii-btn w-100" type="submit">SEND ♡</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
    (() => {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
</body>
</html>
