<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="celestial-theme">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">Assignment 4</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Part 1 (HTML)</a></li>
                    <li class="nav-item"><a class="nav-link" href="bootstrap.html">Part 2 (Bootstrap)</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Part 3 (Register)</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-5 d-flex justify-content-center">
        <div class="celestial-card p-4 p-md-5">
            <h2 class="text-center mb-4 celestial-title">Part 1: Contact Form</h2>
            <form action="#" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="celestial-input form-control" id="name" name="name" required minlength="2" maxlength="50" placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="celestial-input form-control" id="email" name="email" required placeholder="name@example.com">
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="celestial-input form-control" id="message" name="message" rows="4" required maxlength="300" placeholder="Your message..."></textarea>
                </div>

                <button type="submit" class="celestial-btn w-100 mt-3">SEND MESSAGE ✦</button>
            </form>
        </div>
    </div>
</body>
</html>
